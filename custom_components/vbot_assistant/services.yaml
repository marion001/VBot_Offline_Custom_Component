bluetooth_command:
  name: Quản lý Bluetooth trên VBot
  description: Quét, ghép đôi, kết nối hoặc ngắt thiết bị qua MQTT và chờ loa xác nhận.
  target:
    entity:
      integration: vbot_assistant
      domain: select
  fields:
    action:
      name: Thao tác
      required: true
      selector:
        select:
          options: [scan, pair, connect, sink_connect, device_disconnect]
    mac:
      name: Địa chỉ MAC
      description: Không cần khi quét thiết bị.
      selector:
        text:
say:
  name: Phát TTS trên VBot
  description: Gửi nội dung TTS đến một hoặc nhiều thiết bị VBot qua MQTT.
  target:
    device:
      integration: vbot_assistant
    entity:
      integration: vbot_assistant
      domain: media_player
  fields:
    device_id:
      name: MQTT Client ID cũ
      description: Dành cho automation cũ; với automation mới hãy dùng mục tiêu Thiết bị hoặc Entity phía trên.
      required: false
      example: VBot_Client_R1
      selector:
        text:
    message:
      name: Nội dung
      description: Văn bản cần phát trên loa.
      required: true
      example: Xin chào, đây là loa Phicomm R1
      selector:
        text:
          multiline: true
